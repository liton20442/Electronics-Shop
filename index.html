<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1565c0">
<title>Electronics Shop</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f6fa;
color:#222
}
header{
background:#1565c0;
color:#fff;
padding:18px;
text-align:center;
font-size:23px;
font-weight:bold
}
.container{max-width:950px;margin:auto;padding:15px}
.card{
background:#fff;
border-radius:12px;
padding:15px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08)
}
h2{margin-top:0}
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}
input,select,button,textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px
}
textarea{min-height:70px}
button{
border:0;
background:#1565c0;
color:white;
font-weight:bold
}
button.green{background:#2e7d32}
button.red{background:#c62828}
button.orange{background:#ef6c00}
label{
display:block;
font-weight:bold;
margin-bottom:5px
}
.form-group{margin-bottom:12px}
.stat-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}
.stat{
background:#e3f2fd;
padding:15px;
border-radius:10px;
text-align:center
}
.stat strong{
display:block;
font-size:24px;
margin-top:5px
}
.nav{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-bottom:15px
}
.nav button{background:#455a64}
table{
width:100%;
border-collapse:collapse;
margin-top:10px;
font-size:14px
}
th,td{
border:1px solid #ddd;
padding:8px;
text-align:left
}
th{background:#e3f2fd}
.hidden{display:none}
.total-box{
background:#fff3e0;
padding:12px;
border-radius:8px;
margin-top:10px;
font-weight:bold
}
.due{color:#c62828;font-weight:bold}
.paid{color:#2e7d32;font-weight:bold}

@media(max-width:600px){
.grid,.stat-grid{grid-template-columns:1fr}
.nav{grid-template-columns:repeat(2,1fr)}
table{font-size:12px}
th,td{padding:6px}
}
</style>
</head>

<body>

<header>📱 Electronics Shop</header>

<div class="container">

<!-- DASHBOARD -->
<div id="dashboardSection">

<div class="card">
<h2>📊 Dashboard</h2>

<div class="stat-grid">

<div class="stat">
Total Products
<strong id="totalProducts">0</strong>
</div>

<div class="stat">
Total Stock
<strong id="totalStock">0</strong>
</div>

<div class="stat">
Today's Purchase
<strong id="todayPurchase">৳0</strong>
</div>

<div class="stat">
Today's Sales
<strong id="todaySales">৳0</strong>
</div>

<div class="stat">
Total Customer Due
<strong id="totalDue">৳0</strong>
</div>

<div class="stat">
Today's Collection
<strong id="todayPayment">৳0</strong>
</div>

</div>
</div>

<div class="nav">
<button onclick="showSection('productSection')">➕ Products</button>
<button onclick="showSection('purchaseSection')">📦 Purchase</button>
<button onclick="showSection('salesSection')">🛒 Sales</button>
<button onclick="showSection('customerSection')">👤 Customers</button>
<button onclick="showSection('paymentSection')">💰 Collection</button>
<button onclick="showSection('reportSection')">📊 Reports</button>
</div>

</div>


<!-- PRODUCTS -->
<div id="productSection" class="card hidden">

<h2>➕ Add Product</h2>

<div class="grid">

<div class="form-group">
<label>Product Name *</label>
<input id="productName" placeholder="Example: Capacitor">
</div>

<div class="form-group">
<label>Category</label>
<input id="productCategory" placeholder="Example: Capacitor">
</div>

<div class="form-group">
<label>Part Number</label>
<input id="productPart" placeholder="Example: 2N3055">
</div>

<div class="form-group">
<label>Value</label>
<input id="productValue" placeholder="Example: 470 µF">
</div>

<div class="form-group">
<label>Voltage</label>
<input id="productVoltage" placeholder="Example: 25V">
</div>

<div class="form-group">
<label>Sale Price</label>
<input id="productSalePrice" type="number" min="0" placeholder="Can be added later">
</div>

</div>

<div class="form-group">
<label>Other Information</label>
<textarea id="productNote" placeholder="Optional"></textarea>
</div>

<button onclick="addProduct()">💾 Save Product</button>

<hr>

<h2>🔎 Product List</h2>

<input id="productSearch"
placeholder="Search by product, part number, value or voltage"
oninput="renderProducts()">

<div id="productList"></div>

</div>


<!-- PURCHASE -->
<div id="purchaseSection" class="card hidden">

<h2>📦 Purchase</h2>

<div class="grid">

<div class="form-group">
<label>Purchase Date *</label>
<input id="purchaseDate" type="date">
</div>

<div class="form-group">
<label>Supplier / Shop Name</label>
<input id="supplierName" placeholder="Shop name">
</div>

<div class="form-group">
<label>Mobile Number</label>
<input id="supplierMobile" type="tel" placeholder="Mobile number">
</div>

<div class="form-group">
<label>Product *</label>
<select id="purchaseProduct"></select>
</div>

<div class="form-group">
<label>Quantity *</label>
<input id="purchaseQty" type="number" min="1"
oninput="calculatePurchase()">
</div>

<div class="form-group">
<label>Purchase Price per Piece *</label>
<input id="purchasePrice" type="number" min="0"
oninput="calculatePurchase()">
</div>

</div>

<div class="total-box">
Total Purchase: <span id="purchaseTotal">৳0</span>
</div>

<br>

<button class="green" onclick="addPurchase()">
📦 Save Purchase
</button>

<div id="purchaseList"></div>

</div>


<!-- SALES -->
<div id="salesSection" class="card hidden">

<h2>🛒 Sales</h2>

<div class="grid">

<div class="form-group">
<label>Sales Date *</label>
<input id="salesDate" type="date">
</div>

<div class="form-group">
<label>Customer Name</label>
<input id="customerName" placeholder="Customer name">
</div>

<div class="form-group">
<label>Mobile Number</label>
<input id="customerMobile" type="tel"
placeholder="Mobile number">
</div>

<div class="form-group">
<label>Product *</label>
<select id="salesProduct"
onchange="loadProductSalePrice()"></select>
</div>

<div class="form-group">
<label>Quantity *</label>
<input id="salesQty" type="number" min="1"
oninput="calculateSale()">
</div>

<div class="form-group">
<label>Sale Price per Piece *</label>
<input id="salesPrice" type="number" min="0"
oninput="calculateSale()">
</div>

<div class="form-group">
<label>Payment Type</label>
<select id="paymentType"
onchange="togglePaidAmount()">
<option value="full">Fully Paid</option>
<option value="partial">Partially Paid</option>
<option value="due">Due</option>
</select>
</div>

<div class="form-group">
<label>Paid Now</label>
<input id="paidAmount" type="number" min="0"
value="0" oninput="calculateSale()">
</div>

</div>

<div class="total-box">
Total Sale: <span id="salesTotal">৳0</span><br>
Due: <span id="salesDue">৳0</span>
</div>

<br>

<button class="green" onclick="addSale()">
🛒 Save Sale
</button>

<div id="salesList"></div>

</div>


<!-- CUSTOMERS -->
<div id="customerSection" class="card hidden">

<h2>👤 Customer Accounts</h2>

<input id="customerSearch"
placeholder="Search customer name or mobile"
oninput="renderCustomers()">

<div id="customerList"></div>

</div>


<!-- COLLECTION -->
<div id="paymentSection" class="card hidden">

<h2>💰 Due Collection</h2>

<div class="grid">

<div class="form-group">
<label>Payment Date *</label>
<input id="paymentDate" type="date">
</div>

<div class="form-group">
<label>Customer *</label>
<select id="paymentCustomer"></select>
</div>

<div class="form-group">
<label>Payment Amount *</label>
<input id="paymentAmount" type="number" min="1">
</div>

</div>

<div class="form-group">
<label>Note</label>
<input id="paymentNote" placeholder="Optional">
</div>

<button class="green" onclick="addPayment()">
💰 Save Collection
</button>

<div id="paymentList"></div>

</div>


<!-- REPORTS -->
<div id="reportSection" class="card hidden">

<h2>📊 Reports</h2>

<div class="grid">

<button onclick="showPurchaseReport()">
📦 Purchase Report
</button>

<button onclick="showSalesReport()">
🛒 Sales Report
</button>

<button onclick="showStockReport()">
📋 Stock Report
</button>

<button onclick="showDueReport()">
💰 Due Report
</button>

</div>

<div id="reportResult"></div>

</div>

</div>


<script>

const DB_KEY="electronicsShopDataV1";

let db=JSON.parse(localStorage.getItem(DB_KEY))||{
products:[],
purchases:[],
sales:[],
payments:[]
};

function saveDB(){
localStorage.setItem(DB_KEY,JSON.stringify(db));
}

function today(){
return new Date().toISOString().split("T")[0];
}

document.getElementById("purchaseDate").value=today();
document.getElementById("salesDate").value=today();
document.getElementById("paymentDate").value=today();

function money(n){
return "৳"+Number(n||0).toLocaleString("en-US",{
minimumFractionDigits:2,
maximumFractionDigits:2
});
}

function showSection(id){

document.querySelectorAll(".card").forEach(el=>{
if([
"productSection",
"purchaseSection",
"salesSection",
"customerSection",
"paymentSection",
"reportSection"
].includes(el.id)){
el.classList.add("hidden");
}
});

document.getElementById(id).classList.remove("hidden");

refreshSelects();

if(id==="productSection")renderProducts();
if(id==="purchaseSection")renderPurchases();
if(id==="salesSection")renderSales();
if(id==="customerSection")renderCustomers();
if(id==="paymentSection")renderPayments();
}


function addProduct(){

const name=document.getElementById("productName").value.trim();

if(!name){
alert("Please enter product name.");
return;
}

const product={
id:Date.now(),
name:name,
category:document.getElementById("productCategory").value.trim(),
part:document.getElementById("productPart").value.trim(),
value:document.getElementById("productValue").value.trim(),
voltage:document.getElementById("productVoltage").value.trim(),
salePrice:Number(document.getElementById("productSalePrice").value)||0,
note:document.getElementById("productNote").value.trim(),
stock:0
};

db.products.push(product);
saveDB();

[
"productName",
"productCategory",
"productPart",
"productValue",
"productVoltage",
"productSalePrice",
"productNote"
].forEach(id=>{
document.getElementById(id).value="";
});

refreshAll();

alert("Product saved successfully.");
}


function renderProducts(){

const search=(
document.getElementById("productSearch")?.value||""
).toLowerCase();

const list=db.products.filter(p=>
`${p.name} ${p.category} ${p.part} ${p.value} ${p.voltage}`
.toLowerCase()
.includes(search)
);

if(!list.length){
document.getElementById("productList").innerHTML=
"<p>No products found.</p>";
return;
}

let html=`
<table>
<tr>
<th>Product</th>
<th>Value</th>
<th>Voltage</th>
<th>Stock</th>
<th>Sale Price</th>
</tr>`;

list.forEach(p=>{
html+=`
<tr>
<td><b>${esc(p.name)}</b><br>${esc(p.part||"")}</td>
<td>${esc(p.value||"-")}</td>
<td>${esc(p.voltage||"-")}</td>
<td>${p.stock}</td>
<td>${p.salePrice?money(p.salePrice):"—"}</td>
</tr>`;
});

html+="</table>";

document.getElementById("productList").innerHTML=html;
}


function refreshSelects(){

const options=
'<option value="">Select Product</option>'+
db.products.map(p=>
`<option value="${p.id}">
${esc(p.name)}
${p.value?" - "+esc(p.value):""}
${p.voltage?" - "+esc(p.voltage):""}
</option>`
).join("");

document.getElementById("purchaseProduct").innerHTML=options;
document.getElementById("salesProduct").innerHTML=options;

const customers=getCustomers();

document.getElementById("paymentCustomer").innerHTML=
'<option value="">Select Customer</option>'+
customers.map(c=>
`<option value="${esc(c.key)}">
${esc(c.name)}
${c.mobile?" - "+esc(c.mobile):""}
</option>`
).join("");
}


function calculatePurchase(){

const qty=Number(
document.getElementById("purchaseQty").value
)||0;

const price=Number(
document.getElementById("purchasePrice").value
)||0;

document.getElementById("purchaseTotal").textContent=
money(qty*price);
}


function addPurchase(){

const date=document.getElementById("purchaseDate").value;
const productId=Number(
document.getElementById("purchaseProduct").value
);
const qty=Number(
document.getElementById("purchaseQty").value
);
const price=Number(
document.getElementById("purchasePrice").value
);

if(!date||!productId||qty<=0||price<0){
alert("Please complete the purchase information.");
return;
}

const p=db.products.find(x=>x.id===productId);

const purchase={
id:Date.now(),
date:date,
supplier:document.getElementById("supplierName").value.trim(),
mobile:document.getElementById("supplierMobile").value.trim(),
productId:productId,
productName:p.name,
qty:qty,
price:price,
total:qty*price
};

db.purchases.push(purchase);
p.stock+=qty;

saveDB();

document.getElementById("purchaseQty").value="";
document.getElementById("purchasePrice").value="";
document.getElementById("supplierName").value="";
document.getElementById("supplierMobile").value="";

refreshAll();

alert("Purchase saved and stock increased.");
}


function renderPurchases(){

let html="<h3>Recent Purchases</h3>";

if(!db.purchases.length){
html+="<p>No purchases yet.</p>";
}else{

html+=`
<table>
<tr>
<th>Date</th>
<th>Product</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
<th>Supplier</th>
</tr>`;

db.purchases.slice().reverse().forEach(x=>{
html+=`
<tr>
<td>${formatDate(x.date)}</td>
<td>${esc(x.productName)}</td>
<td>${x.qty}</td>
<td>${money(x.price)}</td>
<td>${money(x.total)}</td>
<td>${esc(x.supplier||"-")}</td>
</tr>`;
});

html+="</table>";
}

document.getElementById("purchaseList").innerHTML=html;
}


function loadProductSalePrice(){

const id=Number(
document.getElementById("salesProduct").value
);

const p=db.products.find(x=>x.id===id);

document.getElementById("salesPrice").value=
p&&p.salePrice?p.salePrice:"";

calculateSale();
}


function calculateSale(){

const qty=Number(
document.getElementById("salesQty").value
)||0;

const price=Number(
document.getElementById("salesPrice").value
)||0;

const total=qty*price;

let paid=Number(
document.getElementById("paidAmount").value
)||0;

const type=document.getElementById("paymentType").value;

if(type==="full"){
paid=total;
document.getElementById("paidAmount").value=total||0;
}

if(type==="due"){
paid=0;
document.getElementById("paidAmount").value=0;
}

if(paid>total){
paid=total;
document.getElementById("paidAmount").value=total;
}

document.getElementById("salesTotal").textContent=money(total);
document.getElementById("salesDue").textContent=money(total-paid);
}


function togglePaidAmount(){
calculateSale();
}


function addSale(){

const date=document.getElementById("salesDate").value;

const productId=Number(
document.getElementById("salesProduct").value
);

const qty=Number(
document.getElementById("salesQty").value
);

const price=Number(
document.getElementById("salesPrice").value
);

const customerName=
document.getElementById("customerName").value.trim();

const customerMobile=
document.getElementById("customerMobile").value.trim();

let paid=Number(
document.getElementById("paidAmount").value
)||0;

if(!date||!productId||qty<=0||price<0){
alert("Please complete the sales information.");
return;
}

const p=db.products.find(x=>x.id===productId);

if(!p||p.stock<qty){
alert(
"Insufficient stock. Current stock: "+
(p?p.stock:0)
);
return;
}

const total=qty*price;

const type=document.getElementById("paymentType").value;

if(type==="full")paid=total;
if(type==="due")paid=0;
if(paid>total)paid=total;

const sale={
id:Date.now(),
date:date,
customer:customerName,
mobile:customerMobile,
productId:productId,
productName:p.name,
qty:qty,
price:price,
total:total,
paid:paid,
due:total-paid
};

db.sales.push(sale);
p.stock-=qty;

saveDB();

document.getElementById("salesQty").value="";
document.getElementById("salesPrice").value="";
document.getElementById("customerName").value="";
document.getElementById("customerMobile").value="";
document.getElementById("paidAmount").value=0;
document.getElementById("paymentType").value="full";

refreshAll();

alert("Sale saved successfully.");
}


function renderSales(){

let html="<h3>Recent Sales</h3>";

if(!db.sales.length){
html+="<p>No sales yet.</p>";
}else{

html+=`
<table>
<tr>
<th>Date</th>
<th>Customer</th>
<th>Product</th>
<th>Total</th>
<th>Paid</th>
<th>Due</th>
</tr>`;

db.sales.slice().reverse().forEach(x=>{
html+=`
<tr>
<td>${formatDate(x.date)}</td>
<td>${esc(x.customer||"General")}</td>
<td>${esc(x.productName)}</td>
<td>${money(x.total)}</td>
<td>${money(x.paid)}</td>
<td class="due">${money(x.due)}</td>
</tr>`;
});

html+="</table>";
}

document.getElementById("salesList").innerHTML=html;
}


function customerKey(name,mobile){
return `${name.trim().toLowerCase()}|${mobile.trim()}`;
}


function getCustomers(){

const map={};

db.sales.forEach(s=>{

if(!s.customer)return;

const key=customerKey(
s.customer,
s.mobile||""
);

if(!map[key]){
map[key]={
key:key,
name:s.customer,
mobile:s.mobile||""
};
}
});

db.payments.forEach(p=>{

const key=customerKey(
p.customer,
p.mobile||""
);

if(!map[key]){
map[key]={
key:key,
name:p.customer,
mobile:p.mobile||""
};
}
});

return Object.values(map);
}


function getCustomerBalance(key){

let total=0;
let paid=0;

db.sales.forEach(s=>{

if(
customerKey(s.customer||"",s.mobile||"")===key
){
total+=Number(s.total)||0;
paid+=Number(s.paid)||0;
}
});

db.payments.forEach(p=>{

if(
customerKey(p.customer||"",p.mobile||"")===key
){
paid+=Number(p.amount)||0;
}
});

return{
total:total,
paid:paid,
due:Math.max(0,total-paid)
};
}


function renderCustomers(){

const search=(
document.getElementById("customerSearch")?.value||""
).toLowerCase();

const customers=getCustomers().filter(c=>
`${c.name} ${c.mobile}`
.toLowerCase()
.includes(search)
);

if(!customers.length){
document.getElementById("customerList").innerHTML=
"<p>No customers found.</p>";
return;
}

let html=`
<table>
<tr>
<th>Customer</th>
<th>Mobile</th>
<th>Total Sales</th>
<th>Paid</th>
<th>Current Due</th>
</tr>`;

customers.forEach(c=>{

const b=getCustomerBalance(c.key);

html+=`
<tr>
<td>${esc(c.name)}</td>
<td>${esc(c.mobile||"-")}</td>
<td>${money(b.total)}</td>
<td class="paid">${money(b.paid)}</td>
<td class="due">${money(b.due)}</td>
</tr>`;
});

html+="</table>";

document.getElementById("customerList").innerHTML=html;
}


function addPayment(){

const date=document.getElementById("paymentDate").value;

const key=document.getElementById("paymentCustomer").value;

const amount=Number(
document.getElementById("paymentAmount").value
);

if(!date||!key||amount<=0){
alert("Please complete the payment information.");
return;
}

const customer=getCustomers().find(
c=>c.key===key
);

if(!customer){
alert("Customer not found.");
return;
}

const balance=getCustomerBalance(key);

if(amount>balance.due){
alert(
"Current customer due is "+
money(balance.due)+
". You cannot collect more than this."
);
return;
}

db.payments.push({
id:Date.now(),
date:date,
customer:customer.name,
mobile:customer.mobile,
amount:amount,
note:document.getElementById("paymentNote").value.trim()
});

saveDB();

document.getElementById("paymentAmount").value="";
document.getElementById("paymentNote").value="";

refreshAll();

alert("Payment collected successfully.");
}


function renderPayments(){

let html="<h3>Recent Collections</h3>";

if(!db.payments.length){
html+="<p>No collections yet.</p>";
}else{

html+=`
<table>
<tr>
<th>Date</th>
<th>Customer</th>
<th>Amount</th>
<th>Note</th>
</tr>`;

db.payments.slice().reverse().forEach(x=>{
html+=`
<tr>
<td>${formatDate(x.date)}</td>
<td>${esc(x.customer)}</td>
<td class="paid">${money(x.amount)}</td>
<td>${esc(x.note||"-")}</td>
</tr>`;
});

html+="</table>";
}

document.getElementById("paymentList").innerHTML=html;
}


function showPurchaseReport(){

const total=db.purchases.reduce(
(a,x)=>a+x.total,0
);

document.getElementById("reportResult").innerHTML=`
<div class="total-box">
Total Purchase: ${money(total)}
</div>`;
}


function showSalesReport(){

const total=db.sales.reduce(
(a,x)=>a+x.total,0
);

const paid=db.sales.reduce(
(a,x)=>a+x.paid,0
);

const due=db.sales.reduce(
(a,x)=>a+x.due,0
);

document.getElementById("reportResult").innerHTML=`
<div class="total-box">
Total Sales: ${money(total)}<br>
Total Paid: ${money(paid)}<br>
Sales Due: ${money(due)}
</div>`;
}


function showStockReport(){

let html=`
<table>
<tr>
<th>Product</th>
<th>Value</th>
<th>Voltage</th>
<th>Stock</th>
</tr>`;

db.products.forEach(p=>{
html+=`
<tr>
<td>${esc(p.name)}</td>
<td>${esc(p.value||"-")}</td>
<td>${esc(p.voltage||"-")}</td>
<td>${p.stock}</td>
</tr>`;
});

html+="</table>";

document.getElementById("reportResult").innerHTML=html;
}


function showDueReport(){

let html=`
<table>
<tr>
<th>Customer</th>
<th>Mobile</th>
<th>Current Due</th>
</tr>`;

getCustomers().forEach(c=>{

const b=getCustomerBalance(c.key);

if(b.due>0){

html+=`
<tr>
<td>${esc(c.name)}</td>
<td>${esc(c.mobile||"-")}</td>
<td class="due">${money(b.due)}</td>
</tr>`;
}
});

html+="</table>";

document.getElementById("reportResult").innerHTML=html;
}


function updateDashboard(){

document.getElementById("totalProducts").textContent=
db.products.length;

document.getElementById("totalStock").textContent=
db.products.reduce(
(a,p)=>a+(Number(p.stock)||0),0
);

const t=today();

document.getElementById("todayPurchase").textContent=
money(
db.purchases
.filter(x=>x.date===t)
.reduce((a,x)=>a+x.total,0)
);

document.getElementById("todaySales").textContent=
money(
db.sales
.filter(x=>x.date===t)
.reduce((a,x)=>a+x.total,0)
);

document.getElementById("todayPayment").textContent=
money(
db.payments
.filter(x=>x.date===t)
.reduce((a,x)=>a+x.amount,0)
);

document.getElementById("totalDue").textContent=
money(
getCustomers().reduce(
(a,c)=>a+getCustomerBalance(c.key).due,0
)
);
}


function refreshAll(){

refreshSelects();
updateDashboard();
renderProducts();
renderPurchases();
renderSales();
renderCustomers();
renderPayments();
}


function formatDate(d){

if(!d)return"-";

const p=d.split("-");

if(p.length!==3)return d;

return`${p[2]}-${p[1]}-${p[0]}`;
}


function esc(str){

return String(str??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}


refreshAll();

</script>
